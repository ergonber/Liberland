<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Liberland Academy</title>
  <meta name="description" content="Inicia sesión en tu cuenta de Liberland para acceder a tus cursos.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous"/>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Auth Page Styles -->
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 40px;
      position: relative;
    }
    
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    
    .auth-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 3rem;
      backdrop-filter: blur(20px);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    
    .auth-logo img {
      height: 50px;
    }
    
    .auth-logo span {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .auth-header h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    
    .auth-header p {
      color: var(--text-muted);
    }
    
    .auth-form .form-group {
      margin-bottom: 1.5rem;
    }
    
    .auth-form label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      font-size: 0.95rem;
    }
    
    .input-with-icon {
      position: relative;
    }
    
    .input-with-icon i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1rem;
    }
    
    .input-with-icon input {
      padding-left: 48px;
    }
    
    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    
    .form-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
      cursor: pointer;
    }
    
    .form-row label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }
    
    .form-row a {
      color: var(--accent);
    }
    
    .form-row a:hover {
      text-decoration: underline;
    }
    
    .auth-form .btn {
      width: 100%;
      justify-content: center;
    }
    
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
    }
    
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    
    .auth-divider span {
      color: var(--text-dim);
      font-size: 0.85rem;
    }
    
    .social-login {
      display: flex;
      gap: 1rem;
    }
    
    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .social-btn:hover {
      border-color: var(--accent);
      background: rgba(252, 210, 5, 0.08);
    }
    
    .social-btn i {
      font-size: 1.2rem;
    }
    
    .social-btn.google i { color: #ea4335; }
    .social-btn.facebook i { color: #1877f2; }
    .social-btn.github i { color: #fff; }
    
    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    
    .auth-footer a {
      color: var(--accent);
      font-weight: 600;
    }
    
    .auth-footer a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.5rem;
      }
      
      .social-login {
        flex-direction: column;
      }
    }
  </style>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/Liberland_logo.png">
</head>
<body>

  <!-- ==================== NAVBAR ==================== -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="images/Liberland_logo.png" alt="Liberland Logo">
        <span class="logo-text">Liberland Academy</span>
      </a>
      
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html#courses">Cursos</a></li>
        <li><a href="index.html#pricing">Precios</a></li>
        <li><a href="register.html" class="nav-cta">Crear Cuenta</a></li>
      </ul>
      
      <div class="nav-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <!-- ==================== LOGIN FORM ==================== -->
  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <img src="images/Liberland_logo.png" alt="Liberland">
            <span>Liberland Academy</span>
          </div>
          <h1>Bienvenido de nuevo</h1>
          <p>Inicia sesión para acceder a tus cursos</p>
        </div>
        
        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com" required>
            </div>
          </div>
          
          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
          </div>
          
          <div class="form-row">
            <label>
              <input type="checkbox" name="remember"> Recordarme
            </label>
            <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
          </div>
          
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i>
            Iniciar Sesión
          </button>
        </form>
        
        <div class="auth-divider">
          <span>o continúa con</span>
        </div>
        
        <div class="social-login">
          <button class="social-btn google">
            <i class="fab fa-google"></i>
            Google
          </button>
        </div>
        
        <div class="auth-footer">
          ¿No tienes cuenta? <a href="register.html">Regístrate gratis</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" integrity="sha384-sEVIly94UBRLKWdkYoPpSG7GD/e79YHMrxVyZaOk712Ga7+EAw6w1EFi+xBzBdd+" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" integrity="sha384-M481iNZJtbpypKgvlvZ+78Giq0BsewFLk5r2k+MOcGXlwKCc27DQRZ+WCV/zpmpC" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js" integrity="sha384-6I0gWsz4FIAr30c0TxIxJnPQuJiZ1FfILdZrgJdjxTH3R8dgPGTvexbyqTvReV6Z" crossorigin="anonymous"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Redirect if already logged in
    AuthManager.onAuthChange((user) => {
      if (user) window.location.href = 'dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando sesión...';
      submitBtn.disabled = true;
      
      try {
        await window.fb.signInWithEmailAndPassword(email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        let message = 'Error al iniciar sesión';
        switch (error.code) {
          case 'auth/user-not-found':
            message = 'No existe una cuenta con este email';
            break;
          case 'auth/wrong-password':
            message = 'Contraseña incorrecta';
            break;
          case 'auth/invalid-email':
            message = 'Email inválido';
            break;
          case 'auth/too-many-requests':
            message = 'Demasiados intentos. Intenta más tarde';
            break;
          case 'auth/invalid-credential':
            message = 'Email o contraseña incorrectos';
            break;
        }
        alert(message);
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    // Google sign-in
    document.querySelector('.social-btn.google').addEventListener('click', async () => {
      try {
        const result = await window.fb.signInWithPopup(window.firebaseGoogleProvider);
        const user = result.user;
        try {
          const existingUser = await window.fb.getUserData(user.uid);
          if (!existingUser) {
            await window.fb.createUserDoc(user.uid, {
              name: user.displayName || user.email.split('@')[0],
              email: user.email,
              photoURL: user.photoURL
            });
          }
        } catch (docError) {
          console.warn('Firestore doc creation failed:', docError);
        }
        window.location.href = 'dashboard.html';
      } catch (error) {
        if (error.code !== 'auth/popup-closed-by-user') {
          alert('Error al iniciar sesión con Google');
        }
      }
    });
  </script>
</body>
</html>
